# Name of the run. Used for output directory suffix and wandb.
name: nanobrain

# Description of the run. Goes in wandb notes.
notes: null

# Root output directory. The run writes to <output_dir>/<name> when name is set.
output_dir: output

# Data.
train_filelist: src/nanobrain/config/fomo300k_images.txt
# optional subset of train_filelist that the lr decay phase draws from (null = off)
anneal_filelist: null
num_workers: 8
prefetch_factor: 2
# gpu prep of the next batches in background threads on side streams (same math, ~21% faster
# ViT-B steps). 0 = prep in the loop
prep_threads: 2
# same prep values with less work: masks decoded and bit packed in the loader workers, 2 tensors
# per batch through the loader, fewer gpu kernels (prep.sample_transform_into)
prep_lean: false
clip_quantiles: [0.005, 0.995]
# images.parquet age targets for the age head (model_kwargs.age_weight): within = (age - collection
# mean) / 10, raw = (age - 30) / 20, global = standardized over the list (null = off)
age_target: null
# fraction of training before the age head's encoder gradient starts ramping (0 = from the start)
age_start: 0.0
# sample images with weight n_subject^-alpha (0/null = uniform epochs); counts from this list (null = train list)
subject_temper: null
subject_temper_list: null

# Fixed 1mm grid that all images are fit to.
grid_size: [192, 240, 192]
target_spacing: 1.0
patch_size: 8
# No resampling: each image keeps its voxel grid inside the grid_size mm box, with patches of
# max(1, round(patch_size / spacing)) voxels per axis (~patch_size mm). Evals stay at 1 mm.
native: false

# Sequence sampling. ~3200 brain mask patches per image on average, so num_visible 640 is a
# ~0.8 mask ratio.
num_visible: 640
num_predict: 1920
num_samples: 2

# Model (ViT-B encoder).
model_kwargs:
  depth: 12
  embed_dim: 768
  num_heads: 12
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 0
  drop_path_rate: 0.0

# Optimization. batch_size is images per step per gpu; each gives num_samples sequences.
batch_size: 32
accum_iter: 1

base_lr: 5e-4
lr: null
min_lr: 1e-6
# refuse to train unless the code is a clean git checkout (release runs)
require_clean_git: false
# Total wall time limit in minutes.
# ViT-B runs ~0.16 s/step on one H100, so ~22.5K steps in 1 hr.
time_limit: 60
total_steps: 22500
warmup_steps: 6750
decay_steps: 0
# or the schedule in epochs of train_filelist (overrides the three step counts; null = off)
epochs: null
warmup_epochs: 0
decay_epochs: 0
weight_decay: 0.05
betas: [0.9, 0.95]
clip_grad: 1.0
fused_adamw: true
# adamw, or muon for the block matrices (adamw for the rest). muon's update is scaled to
# adamw's rms, so it shares the lr schedule, times muon_lr_mult.
optimizer: adamw
muon_lr_mult: 1.0
muon_momentum: 0.95
muon_encoder_only: false
muon_decoder_only: false
# muon on every 2d weight (patch embed, decoder proj, heads too), not just the blocks
muon_all_matrices: false
# compiled muon step: fused momentum/cast/update kernels, grad clip folded in
muon_fused: false

amp: true
amp_dtype: bfloat16
compile: true
# speed only, same math: gc.freeze() after the first step
gc_freeze: false
# speed only, same math: encoder / decoder / loss fwd + bwd as cuda graphs (single gpu, not native)
cudagraphs: false
# speed only: source snapshot in a background thread
fast_startup: false
# speed only: training loop on a high priority cuda stream (prep threads stay at priority 0)
high_priority_stream: false
# speed, same math: the last decoder block computes only the mask token rows the head reads
# (~3% fewer flops at bs32 np768)
decoder_prune_last: false
# sdpa flash backend, e.g. FA3 (null = torch default)
flash_attention_impl: null

# Checkpointing. checkpoint-last.pth is overwritten every checkpoint_period steps and at the end.
# checkpoint_steps lists steps to also keep as numbered checkpoints.
ckpt: null
resume: false
auto_resume: true
checkpoint_period: 2500
checkpoint_steps: null

# Logging.
print_freq: 100
plot_period: 5000
plot_nrow: 4
plot_ncol: 2
# Number of patches to predict for plotting. null predicts all unseen mask patches.
plot_num_predict: null

device: cuda
# multi gpu ddp, launched with torchrun (scripts/train_ddp.sbatch); false = one gpu
distributed: false
seed: 7338
debug: false

wandb: false
wandb_entity: null
wandb_project: nanobrain
