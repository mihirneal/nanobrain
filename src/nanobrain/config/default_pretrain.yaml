# Name of the run. Used for output directory suffix and wandb.
name: nanobrain

# Description of the run. Goes in wandb notes.
notes: null

# Root output directory. The run writes to <output_dir>/<name> when name is set.
output_dir: output

# Data.
data_root: /data/mihir-stuff/nanobrain-prep/brain-mask
train_filelist: /data/mihir-stuff/nanobrain-prep/brain-mask/filelist_subsampled.txt
num_workers: 8
prefetch_factor: 2

# Fixed 1mm grid that all images are fit to.
# todo: decide whether the grid should be a config option or constant
grid_size: [192, 240, 192]
patch_size: 8

# Sequence sampling. ~3100 brain mask patches per image (median), so num_visible 512 is a
# ~0.83 mask ratio.
num_visible: 512
num_predict: 1280
num_samples: 2

# Model (ViT-B encoder).
model_kwargs:
  depth: 12
  embed_dim: 768
  num_heads: 12
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 0
  drop_path_rate: 0.0

# Optimization. batch_size is images per step; each gives num_samples sequences.
epochs: 23
batch_size: 32
accum_iter: 1

base_lr: 0.002
lr: null
min_lr: 1e-6
warmup_epochs: 5
lr_decay_frac: 0.2
weight_decay: 0.05
betas: [0.9, 0.95]
# adamw, or muon for the block matrices (adamw for the rest). muon's update is scaled to
# adamw's rms, so it shares the lr schedule, times muon_lr_mult.
optimizer: muon
muon_lr_mult: 2.0
muon_momentum: 0.95
# muon only for the encoder blocks / only for the decoder blocks, adamw for the other side
muon_encoder_only: false
muon_decoder_only: false
# compiled muon step: fused momentum/cast/update kernels, newton-schulz polynomial as one matrix,
# grad clip folded in. same math up to bf16 rounding (closer to an fp64 reference than unfused)
muon_fused: true
clip_grad: 1.0
fused_adamw: true

amp: true
amp_dtype: bfloat16
compile: true
# run the training step on a high priority cuda stream (data prep fills the gaps)
prioritize_compute: true

# Checkpointing.
ckpt: null
resume: false
auto_resume: true
start_epoch: 0
checkpoint_period: 10
max_checkpoints: 5

# Logging.
print_freq: 100
plot_period: 5
plot_nrow: 4
plot_ncol: 2
# Number of patches to predict for plotting. null predicts all unseen mask patches.
plot_num_predict: null

device: cuda
seed: 7338
debug: false

wandb: false
wandb_entity: null
wandb_project: nanobrain
